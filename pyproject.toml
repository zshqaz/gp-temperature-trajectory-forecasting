[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gp-temperature-experiment"
version = "1.0.0"
description = "Replicated-curve Gaussian Process experiment for July ERA5 temperature trajectories"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.3,<3",
  "pandas>=3.0,<4",
]

[project.scripts]
gp-temperature-experiment = "gp_temperature_experiment.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["gp_temperature_experiment*"]
